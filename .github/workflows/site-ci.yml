name: Wiki CI

on:
  pull_request:
    branches: [v5]
  push:
    branches: [v5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run install-plugins
      - name: Check types
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build wiki
        run: npx quartz build
